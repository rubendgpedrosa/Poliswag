name: Poliswag CI Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    # First, check code formatting. black/ruff/vulture are already installed
    # pinned from requirements-dev.txt — never reinstall them unbounded here.
    - name: Lint code with Black
      run: black --check .

    - name: Lint code with Ruff
      run: ruff check .

    - name: Refuse game-side and interception code
      run: python3 scripts/check_private_tech.py --all

    - name: Run tests
      run: pytest

    # Now perform security scanning; override commit range and use full history
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_COMMIT_RANGE: ''

    # Additional quality checks
    - name: Check for dead code with Vulture
      run: vulture . --min-confidence 70

  integration:
    name: Disposable DB (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: events
          - suite: hundo
          - suite: spawn

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run disposable SQL suite
      run: ./scripts/test_disposable_sql.sh ${{ matrix.suite }}
