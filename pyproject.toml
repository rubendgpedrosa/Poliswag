[tool.black]
# Directories, anchored. Unanchored, "data" also matched
# modules/database_connector.py and its tests, so `black --check .` in CI
# never looked at them (the commit hook did, file by file).
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | _build
  | buck-out
  | logs
  | data
  | state
  | mock_data
  | mock_database
  | templates
  | \.vscode
  | \.github
)/
'''

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=modules",
    "--cov=cogs",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"

[tool.ruff]
# The rule set is pinned on purpose: ruff's defaults move between releases,
# so the CI gate would change under us on every bump. Widen it deliberately,
# one rule family at a time, once its existing findings are fixed. I (import
# order, black-compatible) joined the set that way.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
